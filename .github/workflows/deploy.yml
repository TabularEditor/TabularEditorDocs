name: Docs CI/CD

# Stage-2 pipeline for the docs site (new governance setup).
#
# Flow:
#   PR         -> build -> preview environment on the test SWA (URL commented on the PR)
#   main push  -> build once -> staging (test SWA, automatic)
#                            -> production (prod SWA) AFTER required-reviewer approval
#
# BEFORE this lands on main (order matters):
#   1. Create the GitHub environment "production": add Required Reviewers (the docs release
#      group), restrict deployments to the main branch, and add AZURE_SWA_TOKEN_PROD as an
#      ENVIRONMENT secret. If the environment does not exist when this workflow first runs,
#      GitHub auto-creates it WITHOUT protection rules and the approval gate is a no-op.
#   2. AZURE_SWA_TOKEN_TEST stays a repository secret (previews + staging need it on PR events).
#   3. The DNS flip to the new prod SWA must already be done - this PR deletes the old
#      deploy.yml, so after the merge nothing deploys to the old SWA anymore. (Between the
#      flip and this merge, main merges reach no live site - keep that window short.)
#
# Cleanup that rides along or follows: deploy-staging.yml is deleted before this PR is merged
# (it only exists to seed the staging SWA from the feature branch), and the old
# AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_MUD_081AFFE03 secret is deleted once the old SWA
# is decommissioned.
#
# Fork PRs: repository secrets are not exposed to pull_request runs from forks, so fork PRs
# build but do not get preview deployments - same limitation as the old setup.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed, review_requested]
    branches:
      - main

jobs:
  build_job:
    # Same localization-branch carve-out as the old deploy.yml: the bulk 'localization' PR only
    # builds when a review is requested, to avoid rebuilding on every bot sync.
    if: (github.head_ref != 'localization' && github.event_name == 'push') || (github.head_ref != 'localization' && github.event_name == 'pull_request' && github.event.action != 'closed') || (github.head_ref == 'localization' && github.event.action == 'review_requested')
    runs-on: windows-latest
    name: Build Documentation
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache DocFX
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: docfx-${{ runner.os }}
      - name: Install DocFX
        run: dotnet tool install -g docfx --ignore-failed-sources
      - name: Generate configs
        run: |
          python build_scripts/gen_redirects.py
          python build_scripts/gen_languages.py
      - name: Generate API metadata
        run: docfx metadata localizedContent/en/docfx.json
      - name: Verify API files generated
        run: |
          if (!(Test-Path "content/api/toc.yml")) {
            Write-Error "API metadata generation failed - toc.yml not found"
            exit 1
          }
          Write-Host "API files generated: $((Get-ChildItem content/api/*.yml).Count) YAML files"
        shell: pwsh
      - name: Build all documentation
        run: python build-docs.py --all --skip-gen
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          # 30 days so a pending prod approval (GitHub expires them after 30 days) can always
          # still deploy its artifact, and recent runs stay re-runnable as a rollback path.
          retention-days: 30
          path: _site

  # PR -> preview environment on the TEST Static Web App. The SWA action creates/updates a
  # preview environment automatically for pull_request events and comments the URL on the PR.
  deploy_preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build_job
    runs-on: ubuntu-latest
    name: Deploy PR Preview (staging SWA)
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Deploy preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "_site"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR Preview
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          action: "close"

  # main -> staging, automatically (production slot of the test SWA).
  deploy_staging:
    if: github.event_name == 'push'
    needs: build_job
    runs-on: ubuntu-latest
    name: Deploy to Staging
    environment:
      name: staging
      url: https://docs-staging.tabulareditor.com
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      # OPTIONAL (stakeholder decision): keep crawlers off staging without touching the
      # artifact that prod will reuse - patches only the staging COPY of the SWA config.
      # Canonical tags already point at prod, so this is belt-and-braces, not required.
      # - name: Add noindex header to staging copy
      #   run: |
      #     jq '.globalHeaders["X-Robots-Tag"] = "noindex"' _site/staticwebapp.config.json > tmp.json
      #     mv tmp.json _site/staticwebapp.config.json
      - name: Deploy to staging SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_TEST }}
          action: "upload"
          app_location: "_site"
          api_location: ""
          output_location: ""
          skip_app_build: true

  # main -> production, gated. The job pauses here until someone in the 'production'
  # environment's Required Reviewers approves it in the Actions UI. It then ships the SAME
  # artifact staging verified - never a rebuild.
  deploy_production:
    if: github.event_name == 'push'
    needs: [build_job, deploy_staging]
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment:
      name: production
      url: https://docs.tabulareditor.com
    # If several merges stack up unapproved, older pending deployments are cancelled so only
    # the newest merge can be approved - stale content can never be promoted by accident.
    concurrency:
      group: docs-prod-deploy
      cancel-in-progress: true
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Deploy to production SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Environment secret under 'production' - unreadable before the approval gate.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_PROD }}
          action: "upload"
          app_location: "_site"
          api_location: ""
          output_location: ""
          skip_app_build: true
